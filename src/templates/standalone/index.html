<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panorama Viewer</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        .panorama-viewer {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        #pano {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-size: 18px;
        }
        
        .loading-screen.hidden {
            display: none;
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="panorama-viewer">
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <span>Loading panorama...</span>
    </div>
    
    <div id="pano"></div>
    
    <!-- Logo will be injected here -->
    <div id="logo-container"></div>
    
    <!-- MiniMap will be injected here -->
    <div id="minimap-container"></div>
    
    <!-- Floor selector (simplified control panel) will be injected here -->
    <div id="controls-container"></div>
    
    <!-- Project data will be injected here -->
    <script id="project-data" type="application/json">{{PROJECT_DATA}}</script>
    
    <!-- Marzipano library -->
    <script src="./marzipano.js"></script>
    
    <!-- Standalone viewer script -->
    <script src="./viewer.js"></script>
</body>
</html>
